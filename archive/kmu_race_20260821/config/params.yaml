# 2026 국민대 자율주행 경진대회 — 실차 튜닝 파라미터
#
# 값을 바꿀 때는 **반드시 이 파일만** 고친다. 소스에 흩어놓으면 대회 당일
# 어느 값이 적용 중인지 아무도 모르게 된다.
#
# ★ 표시는 실차 계측이 필요한 값 — 연습주행 때 반드시 실측해서 채울 것.

/**:
  ros__parameters:
    # ── 실행 ──────────────────────────────────────────────────────
    control_hz: 50.0
    debug_gui: false            # 대회 당일 false 고정 (규정 p.16, 프레임 확보)

    # ── 토픽 ──────────────────────────────────────────────────────
    image_topic: "/image_raw"
    scan_topic: "/scan"
    imu_topic: "/imu"
    motor_topic: "xycar_motor"
    # false = Float32MultiArray [angle, speed]  ← 실차 미니PC Y모델
    # true  = xycar_msgs/XycarMotor .angle/.speed ← Unity 시뮬레이터 계통
    use_xycar_msgs: false

    # ★ 명령속도 → m/s 환산. 정지/주행 장애물 판별의 정확도가 여기 달려 있다.
    #   0.08 = kobot(Jetson) 모터 체인의 설계값 — kobot_vehicle/motor_adapter 가
    #   speed×0.08 을 목표 m/s 로 Ackermann/VESC 에 넘기고 VESC 가 폐루프 추종한다.
    #   검증법: 평지 직선에서 speed=15 로 5초 주행, 이동거리 / 5 / 15 ≈ 0.08 확인.
    #   (주의: 타팀 UMK 실측 0.1347 은 그들의 ROS1 체인 값 — 복사 금지)
    speed_to_mps: 0.08

    input_timeout_s: 0.35

# ──────────────────────────────────────────────────────────────────
# 아래는 현재 소스 기본값 문서화용. 노드가 읽지는 않는다
# (dataclass 기본값이 곧 진실 — 바꾸려면 해당 모듈의 Config 를 고친다).
# 실차 튜닝 항목을 한눈에 보려고 여기 모아 둔다.
# ──────────────────────────────────────────────────────────────────
#
# perception/signal_detector.py :: SignalConfig
#   roi_top/bottom/left/right   0.03 / 0.60 / 0.02 / 0.98
#     (8/17 확장 — 구 ROI 는 출발 대기 램프 y0.49~0.53 을 세로로 잘라먹었다)
#   ★ min_radius / max_radius   8 / 26     ← 신호등까지 거리에 직결. 실측 필수
#   bright_margin               15.0        ← 조명 조건에 민감. 오전/오후 각각 확인
#   max_candidates              9
#   ── 채도 게이트 (8/13 재설계, run4 bag 실측 — 대회장 조명 오검 대응) ──
#   green_h                     (68, 98)    ← 초록 램프 실측 H 75~95. 램프 교체 시 재실측
#   red_h_max / red_h_wrap      12 / 168    ← 빨강 H (0 근처 감김)
#   chroma_min_s                55          ← lit 판정 채도 하한 (형광등=무채색 차단)
#   ★ blob_min_v                170         ← 랩 마커 블롭 밝기 (발광체만, 수풀 배제)
#   blob_fill_min / max_aspect  0.55 / 2.0  ← 원형 채움비/종횡비 (반사·표지판 배제)
#   unlit_v_max / dark_frac_min 90 / 0.15   ← 소등 램프 검사 (유도등 배제)
#   ── 과노출 심 경로 (8/17 추가·동일 bag 5회 반복 검증, run_0817_1211) ──
#     새 카메라(자동노출)는 점등 심이 하얗게 날아간다 (실측 S 28~67 요동,
#     V 240~253) — 채도 경로가 놓치므로 '흰 심 + 초록 링'을 병행한다.
#   lamp_core_v                 220         ← 흰 심 밝기 하한. ⚠️ 210 금지:
#     프린지(V200~220)가 심에 흡수돼 링 판정 붕괴 (0.42→0.06 실측)
#   ring_in/out_scale           0.9 / 1.7   ← 링 밴드. 프린지는 심 가장자리
#     1~2px — 1.1~1.9 로 벌리면 밴드가 프린지를 벗어난다 (실측)
#   ring_s_min / ring_h_green   30 / (55,100) ← 링 프린지 유채색 판정
#   ★ ring_green_min            0.20        ← 링 초록비율 임계.
#     실측: 진짜 램프 0.13~0.67 vs 조명/반사 ≤0.15 — 신호등 켠 3바퀴 bag
#     을 받으면 이 분리대를 재확인할 것 (본선 전 재실측 1순위)
#   core_min_px / core_max_px   2 / 30      ← 심 폭 범위 (출발 대기 2~4px,
#                                             통과 접근 5~8px, 그 이상 조명)
#   washed_unlit_v_max          150         ← 심 경로 소등 검사 완화 임계
#     (과노출 화면에선 소등 하우징도 V117~172 — 90 기준이면 전멸)
#   ★ washed_min_y_frac         0.30        ← 심 후보 세로 하한(수평선 컷).
#     겐트리 높이(규정 고정)+카메라 피치 기하로 진짜는 y_full 187~219 에만
#     온다 — 창밖 수풀 하늘구멍(y15~125, 랩마다 오발화)·원거리 재목격을
#     전멸시킨 핵심 게이트. ⚠️ 카메라 재장착 시 반드시 재실측
#
# core/control.py :: LaneController  ★★ 0817 밤 신설 — 코너링의 핵심
#   차선 조향 = 곡률 피드포워드 + 방향 정렬 + 횡오차(P/D) + 아펙스 커팅.
#   왜: 횡오차만 보는 P 제어는 정상 선회 중 구조적으로 언더스티어한다
#   (필요 조향을 오차가 아니라 곡률이 정하기 때문). 0817 첫 자율주행 실측
#   1랩 129샘플 최대 조향 19 / 물리 최대 42 → 코너마다 이탈.
#   road_width_m               0.825  ← 주행로 전폭 (0818 줄자 0.80~0.85). 게인 자가보정의 기준자
#   bev_aspect                 0.90   ← BEV 종횡비 s_fwd/s_lat (미실측 추정)
#   ff_scale                   0.55   ← 곡률 피드포워드 여유 (폴리핏 곡률이
#                                       기하 예측보다 ~1.6배 크게 나온다)
#   k_heading                  80     ← 기울기(무차원) → cmd
#   ema_alpha / ff_limit       0.35 / 45
#   ★ apex_gain / apex_engage  0.55 / 0.80
#     이 차의 최소 회전반경은 1.01m (바퀴각 16.5°, 축거 0.30m). 즉 반경
#     1.0m 이하 코너는 **중심선 추종이 물리적으로 불가능**하다. 주행로 폭을
#     써서 실효 반경을 키우는 것이 유일한 해법 — 단, 발동 조건은 곡률
#     추정치가 아니라 **실제 조향 포화율**(축척 무관)로 판단한다.
#   apex_ema_alpha             0.08   ← 지속 코너에서만 켜지고 S자에선 상쇄
#   bias_rate_px               12     ← 아펙스 목표 변화율 제한
#   cmd_saturation             42     ← 서보 포화 (16.5°/0.0068)
#   [검증] tools/lanesim.py 폐루프 시뮬 — 지연(센싱0.05+구동0.04+서보τ0.06)
#     포함, 축척 450~620px/m × 속도 0.6~1.6m/s × 트랙 6종 전부 이탈 0.
#     대조군(옛 제어기)은 같은 시뮬에서 코너 전부 이탈 → 판별력 확인됨.
#
# core/speed_policy.py :: 굽이침 감속 (0817 신설)
#   steer_rate_full_slow       200    ← 조향 변화율[단위/초] 이 값에서 최대 감속
#   wind_min_ratio             0.45   ← S자에서 |steer| 만으론 감속이 안 걸린다
#
# perception/lane_detector.py :: LaneConfig
#   white_v                     (243, 255)  ← segi 실차 검증값
#   canny                       50 / 150
#   sobel_thresh                50
#   ★ default_lane_width_px     670         ← 0818 저녁 실측: 흰↔흰 ≈670px (반차선 335px×2)
#   half_road_default/min/max   335/200/430 ← 노란 중앙선↔흰 선 [px] (0818 저녁 실측 IQR 325~343)
#   pair_width_min/max_px       520/900     ← '진짜 양쪽 흰선 쌍' 간격 대역 — 밖이면 한쪽이 가짜(이음새)
#   center_inside_margin_px     20          ← 중앙선 후보는 흰 선 사이에서만 (바깥 올리브 바닥 차단)
#   max_heading_slope/curvature 0.6/3.5e-3  ← 검출기 출력 위생 클립 (짧은 피팅 잡음)
#
# perception/cone_detector.py :: ConeConfig
#   ★ lower / upper             (0,108,224) / (28,255,255)  ← segi 실차 검증값
#   min_section_px              300         ← 노이즈 하한 (진입 임계는 FSM 의
#                                             cone_min_orange_px=900 하나다 — 리뷰 S2)
#   min_gate_px / max_gate_px   110 / 780   ← 게이트 간격 허용 범위 (0818: 실통로 633px)
#   gate_y_tol_px               110         ← 게이트 쌍 깊이 근접 (같은 줄 오인 방지)
#   (0817 추가) gate_depth_px / gate_width_px 를 함께 보고한다 — 전방주시
#   클램프와 단측 가상 게이트의 입력이다 (core/policy.py 참조)
#
# core/policy.py :: 라바콘 (0817 재설계 — 경쟁팀 ddm 실주행 bag 진단 반영)
#   cone_lookahead_m / _min_m   0.75 / 0.35 ← ★ 상한일 뿐, 실제로는 관측된
#     게이트 깊이로 자른다. 실제로 본 콘보다 먼 곳을 조준하면 코너에서 통로를
#     가로지른다 (ddm chooseTargetX 클램프와 같은 처방)
#   cone_half_corridor_m        0.30 (EMA 0.15, 0.15~0.70) ← 단측 구간에서
#     쓸 학습된 통로 반폭. 반발 풀락은 반대편 콘 열로 처박는 동작이라 폐기
#
# perception/signal_watcher.py :: 위치 기반 신호 판정 ★★ 0817 밤 신설
#   색을 전혀 쓰지 않는다. '켜져 있던 불빛이 꺼지고 그 오른쪽에 새 불빛이
#   켜졌다' = 빨강→초록. 규정 배치(좌→우 빨강·노랑·좌회전·초록)가 근거이고,
#   대기 중 차가 정지해 있다는 사실만 있으면 성립한다.
#   core_v                     220    ← 점등 심 밝기 하한
#   y_min/max_frac             0.28 / 0.62  ← 겐트리 기하 대역 (재장착 시 재실측)
#   mature_s / death_s / birth_s  0.7 / 0.15 / 0.12
#   switch_min/max_mult        1.6 / 6.5 램프폭 ← 2칸(좌회전) 또는 3칸(초록)
#   require_dark_left          true   ← 하우징 구조 확인 (0817 책상 반사 오검 차단)
#
# perception/lamp_pitch.py :: 직좌 페어 기하 단일 출처 ★★ 0819 신설
#   같은 물리량(램프 피치비)이 detector/watcher 에 2배 어긋나 박혀 있던 것을
#   한곳으로 모았다. 실측 피치비 1.25 (= test_signal_watcher LAMP_D 8 / SPACING 10).
#   pair_gap_min/max_mult      0.9 / 1.75 램프폭  ← 인접 한 칸(3·4번)만 인정.
#                                의 상한은 watcher 2.2 / detector 4.5 였고, 후자는
#                                2피치·3피치 쌍까지 통과시켜 오검 표면이었다.
#                                상한/하한 < 2 는 PairWindow 가 생성 시 강제한다.
#   pair_size_ratio_max        2.4    ← 같은 하우징 램프는 크기가 비슷하다
#   pair_row_tol_mult          1.8    ← 같은 줄
#   pair_neighbour_clear_mult  2.5 램프폭 ← 쌍의 **양옆**이 비어 있어야 한다.
#                                직좌는 정확히 두 개만 켜진다(규정 p.36): 4번은
#                                유닛 오른쪽 끝, 3번 왼쪽 노랑은 소등. 같은 간격
#                                점등체 3개 이상은 물체 열이지 신호등이 아니다.
#
# io/camera_exposure.py :: 노출 제어 ★★ 0817 밤 신설
#   race_node 파라미터 signal_exposure (기본 60, 0=사용 안 함)
#   대기 중에만 수동 노출로 낮춘다 — 바닥·벽이 어두워지고 발광체인 램프만
#   남아 판독이 쉬워진다. **주행 중에는 절대 적용하지 않는다** (차선 흰색
#   임계 V243~255 가 노출에 직결). WAIT_GREEN 이탈 시 자동 복귀.
#
# perception/lidar_tracker.py :: LidarConfig
#   ★ angle_offset              -2.164      ← 8/17 실측: 차 전진축 = 라이다 +124°
#     (거리변화율·점군흐름·자기반사 3중 일치, 콘 구간 정렬 검증). 미보정
#     시 정면 섹터가 후방-좌측을 봐서 뒤에 선 사람을 방해차량으로 오인 —
#     첫 자율주행 OVERTAKE 무한루프의 원인. 라이다 재장착 시 재실측 필수
#   min_range                   0.30        ← 8/17: 자기 반사(0.11~0.25m) 차단
#   front_half_angle            0.26 (±15°)
#   side_clear_m                0.85
#
# core/race_context.py :: LapTrackerConfig
#   ★★ 2026-08-20 저녁 — 랩 마커 지표를 통째로 바꿨다 (반드시 읽을 것) ★★
#     기존 지표(초록 블롭 폭)는 **장면이 바뀌면 축척이 통째로 달라져** 임계가
#     이전되지 않는다. 같은 트랙 같은 날 실측이 이걸 증명한다:
#         run_0820_0019 (오전, 청색편이) 가짜 블롭 최대 294px, ≥18 이 2125프레임
#         run_0820_1821 (저녁, 중성)     진짜 램프      20~22px
#     즉 임계 163 은 진짜 램프를 영원히 못 넘고(그래서 이번 주행 랩 카운팅
#     0회 = 완주 판정 불가), 임계 18 은 오전 오검을 다 통과시킨다. 크기
#     하나로는 원리적으로 분리가 안 된다.
#     → 새 지표 = SignalReading.lap_marker_px
#          '4구가 등간격·등크기·같은 행으로 풀렸고(housing_span_px>0)
#           그 안에서 점등 램프가 색까지 검증됐다(state≠UNKNOWN)' 일 때만
#           하우징 가로폭. 실측 겐트리 84~124px / 그 외 오검은 최장 2프레임.
#          run_0820_1821 재생 결과 **목격 1회 · 오검 0회** (1랩 주행에 정확).
#   ★ min_gantry_span_px        40            ← 위 새 지표에 대한 하한 (0820 저녁)
#     8/13 지표 변경: '검증된 초록 램프 블롭의 가로폭'이다 (원 span 아님).
#     8/17 재산출(kobot 새 카메라, 본선 트랙 bag run_0817_1211): 과노출로
#     심이 작다 — 통과 접근 5~8px, 출발 대기 2~5px(스트릭 3프레임). 크기로
#     근/원거리 분리 불가 → 오검 억제는 검출기 링·y대역 게이트 + min_gap_s
#     담당. 랩 시뮬 실측: 임계 5 에서 출발 35.3/1랩 132.5/2랩 239.8 정확,
#     주행 중 오검 0 (4 는 잡음 유입, 6 은 출발 상실 — 5 가 유일 동작점).
#     신호등 켠 3바퀴 bag 으로 tune_laps.sh(--sweep-gantry) 재검증할 것.
#   confirm_s / release_s       0.09 / 0.40 ← 시간 기준 디바운스 (프레임 수
#                                             아님 — 실차 50Hz vs 리플레이 30fps
#                                             케이던스 차이를 없앤다, 리뷰 T1.
#                                             0.06: 출발 대기 스트릭 3프레임
#                                             실측에 맞춘 하향, 8/17)
#   min_gap_s                   15.0
#   ★ yaw_fill_deg              355         ← 요 보충 랩 (8/17 3바퀴 bag 재설계).
#     통과 램프가 3~8px 로 날마다 요동해 목격 임계 5 는 재현율이 나쁘다
#     (3랩 중 1랩만 목격 실측) — 자이로 z 적산(3랩 오차 3%)이 놓친 랩을
#     |Δ요|≥355° 로 보충한다. min_gap_s 가 보충 직후 실제 목격의 중복을
#     차단. 출발 대기 중엔 hold_start_baseline 이 유령 목격 캡+기준선 동기.
#
# core/race_fsm.py :: FSMConfig
#   green_confirm frames/secs   3 / 0.06    ← 빨간불 출발 = 벌초 10초 (p.20).
#                                             4/0.12→3/0.06 (8/17): 출발 거리
#                                             스트릭 3프레임 실측 — 4프레임
#                                             요구는 출발을 138s 까지 지연시킴
#                                             (FSM 리플레이 실측)
#   start_go_min_span_px        5           ← 출발 보조: 분류 실패해도 초록 블롭
#                                             ≥5px 면 파란불 (RED 분류가 이김,
#                                             8/17 새 카메라 실측 6~8px 로 하향)
#   cone_enter_requires_gate    true        ← 진입은 두 줄 게이트 성립 필수
#                                             (벽면 보관 콘 무더기 오진입 차단)
#   cone_gate_lost_exit_s       4.0         ← 게이트(카메라 **또는 라이다**)가 이만큼 안 생기면 구간
#                                             종료로 보고 이탈 (무더기 고착 방지)
#   start_dark_min_s            3.0         ← 출발 블롭 상승엣지(어두운 구간 요구, 8/17 1.0→3.0)
#   moving_ratio / min_ego      0.6 / 0.35  ← 정지/주행 판별 (speed_to_mps 와 세트)
#   target_trigger_dist_m       1.45
#   ★★ 2026-08-20 저녁 — 회피 트리거 재설계 (사용자 보고: '장애물 회피 불안정')
#     옛 판정: 차 정면으로 **곧게 뻗은** ±0.45m × 1.45m 직사각형 안에 무엇이든
#     2틱 있으면 AVOID_STATIC/OVERTAKE. 문제가 둘이었다.
#       (1) 이 트랙 차로 반폭은 0.41m 인데 코리도 반폭이 0.45m — 차로보다 넓다.
#           코너에서는 바깥 벽이 구조적으로 코리도에 들어온다. 실측 결과
#           maneuvers_enabled=true 였다면 **한 바퀴에 회피가 45~65회** 섰고
#           대부분이 코너 벽이었다. 코리도를 ±0.20m 로 좁혀도 24.7% 가 남는다
#           (코너에서는 벽이 진짜로 정면에 있으니까).
#       (2) '연속 2틱'은 제어 50Hz · 라이다 8.8Hz 라 **같은 스캔을 두 번 본 것**.
#     새 판정 (셋 다 만족해야 발동):
#       lane_corridor_half_m   0.30   ← 카메라가 아는 **차로를 따라 휘는** 코리도
#       target_min_dist_m      0.40   ← 이보다 가까우면 이미 옆이라 피할 수 없다
#       target_enter_seconds   0.80   ← 진짜 장애물은 1.45→0.5m 를 계속 막는다
#       target_approach_min_m  0.12   ← 그 동안 실제로 가까워져야 한다
#     실측(run_0820_1821, 주행 186초): 전방타겟 프레임 38.1%→20.9%,
#     기동 총시간 60.1초→22.9초(−62%). 남은 16회는 이 연습실 트랙 옆의
#     의자·책상·사람이라 지각으로는 더 못 가른다 — 본선 트랙에서 재확인할 것.
#   ★ wait_green_timeout_s      0.0 (꺼짐)   ← WAIT_GREEN 최후 폴백. 켜면 신호
#     판독 실패로 인한 DNF 를 면하지만 빨간불 출발 시 규정 p.20 벌초를 받는다.
#     **사람이 정할 값**이다. 진단 경고(5초 주기)는 항상 켜져 있다.
#   ★ shortcut_turn_deg         55.0        ← 지름길 진입 좌회전 완료 판정 (0818 run4 실측 57°)
#   stop_recover_frames/secs    5 / 0.5     ← STOP 복귀 디바운스 (p.21 1분 룰,
#                                             STOP 은 터미널이 아니다)
#   ★ lap3_infer_enabled        false       ← 규정 p.35 추론 (race_node 파라미터)
#                                             좌회전은 랩2·랩3 중 정확히 1회.
#                                             랩2 에서 겐트리를 lap2_clear_frames_min
#                                             프레임 이상 또렷이 보고도 직좌가
#                                             아니었으면 좌회전은 랩3 확정 →
#                                             랩3 판독이 침묵해도 지름길 진입.
#                                             ⚠️ 기본 봉인. 틀리는 경로는 무신호
#                                             진입이고 규정에 벌칙 기재가 없어
#                                             심판 재량이다. 진짜 직좌 bag 으로
#                                             페어 검출을 검증한 뒤에만 켠다.
#   lap2_clear_frames_min       8           ← 위 음성 관측의 최소 프레임 수 (하한값)
#   left_latch_min_span_px      5           ← GREEN_LEFT 래치 근접 게이트
#                                             (겐트리 블롭 없이는 좌회전 안 믿음.
#                                             8/17: 램프 폭 실측 6~8px 라 10 은
#                                             영원히 안 넘어 지름길 상실 → 5)
#
# core/heading.py :: GyroHeadingConfig (8/17 신설 — IMU 포렌식 대응)
#   axis                        "z"         ← 차량 헤딩이 실리는 자이로 축.
#     이 IMU 는 orientation 쿼터니언이 회전을 안 담는다 (2바퀴 bag 오일러
#     3축 적산 전부 ~0°) — 헤딩은 자이로 z 적분으로 얻는다. 실측 검증:
#     바이어스 보정 적분 gz -811° ≈ 2바퀴(-720°)+주차회전. IMU 재장착 시
#     3축 적산으로 축 재확인 필수 (core/heading.py 모듈 주석의 방법).
#   calib_s                     3.0         ← 기동 후 정지 바이어스 추정 시간.
#     실측 바이어스 gz +2.67°/s (보정 없인 60s 에 160° 가짜 회전).
#
# core/target_passing.py :: PassConfig
#   pass_offset_px              300         ← 횡이동 **상한**[px]. 실제 이동량은 타겟 횡위치에서
#   clearance_m / px_per_m      0.35 / 810     d = clearance − side·target_y (0818 저녁 폐루프 재설계)
#   track_corridor_m            1.2         ← 기동 중 타겟 추적 코리도 (0.45 는
#                                             자기 횡이동에 타겟을 놓친다, 리뷰 C2)
#   return_deadline_m           0.90        ← 규정 p.32 (고정값, 바꾸지 말 것)
#   min_gap_m                   0.55
#
# core/speed_policy.py :: SpeedConfig
#   base: LANE_DRIVE 20 / CONE 11 / AVOID 13 / OVERTAKE 15 / SHORTCUT 12
#   max_speed                   26.0
#   pressure_boost              1.30
#
# core/policy.py :: PolicyConfig
#   px_per_m / px_per_m_fwd     810 / 730   ← BEV 가로 축척 = 0818 저녁 실측(335px↔0.41m).
#     세로는 bev_aspect 0.9 가정. 카메라 콘 게이트 폴백 경로에만 쓰인다 (라이다 1순위).
#   shortcut_steer_deg          -34.0
#   finish_coast s/speed        6.0 / 16    ← 결승 관성 주행: 요 보충 FINISH 는
#     마지막 커브 출구(결승선 앞)에서 발화할 수 있다 — 즉시 정지 금지,
#     6s 저속 차선주행으로 Gate 를 확실히 넘고 정지 (8/17)
#   start_straight_hold_s       1.2         ← 출발 직진 홀드. 겐트리 지주가
#                                             차선으로 오검되는 공통 실패 가드

# core/control.py :: 제어 상수
#   WHEELBASE_M                 0.30        ← ★ 실측 대상 (UMK 실측 0.335 — 복사
#                                             말고 우리 차를 줄자로 잴 것)
#   PixelPID kp/kd              0.34 / 0.27
#   SteerSmoother window/rate   3 / 420°s⁻¹
#
# core/safety.py :: SafetyConfig
#   camera_degraded_after_s     0.4         ← 크립 강등
#   camera_dead_after_s         12.0        ← STOP (이후 safety 합의로 복귀)
#   lidar_degraded_after_s      1.0         ← 회피만 불가, 정지 사유 아님
