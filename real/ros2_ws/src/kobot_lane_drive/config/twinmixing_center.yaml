twinmixing_center_drive:
  ros__parameters:
    image_topic: /image_raw
    lidar_topic: /scan
    debug_image_topic: /kobot_lane_drive/twinmixing_center/debug_image
    status_topic: /kobot_lane_drive/twinmixing_center/status
    drive_preview_topic: /kobot_lane_drive/twinmixing_center/drive_preview
    max_processing_hz: 15.0
    debug_publish_hz: 7.0
    variant: large
    use_fp16: true

    # --- 중심 경로 추출 (우선순위 2·3단계) ---
    # 480 높이 기준 y=300 아래만 본다. 위쪽 먼 영역은 벽/천장/조명이 섞여
    # 목표선을 흔들기만 한다. 가까운 노면만 보면 인식이 안정된다.
    roi_top_ratio: 0.50
    # 차 앞 라이다가 y=375 부터 하단 중앙을 가린다. 그 위에서 끊는다.
    roi_bottom_ratio: 0.78
    row_step: 4
    search_half_width_ratio: 0.24
    minimum_gap_width_ratio: 0.004
    maximum_gap_width_ratio: 0.18
    minimum_side_support_ratio: 0.02
    minimum_points: 18
    lookahead_y_ratio: 0.67
    minimum_region_width_ratio: 0.12
    region_search_half_width_ratio: 0.40
    # 영역 중앙을 잡기 직전에 메울 틈의 최대 폭. 640px 기준 22px.
    # 중앙선 자국이 도로를 갈라 넓은 쪽 절반만 쓰게 되는 문제를 막는다.
    region_fill_gap_ratio: 0.035
    minimum_confidence: 0.35

    # --- 노란 중앙선 (우선순위 1단계) ---
    # 조명이 바뀌면 재빌드 없이 여기만 고친다. 노출 조정과 함께 현장에서 다시 맞춘다.
    yellow_enabled: true
    # lab_relative: 그 행의 노면 b* 대비 상대 판정. 조명과 화이트밸런스 변화에 강하다.
    # hsv_absolute: 고정 HSV 상하한. 비교용. 실내에서 나무색이 함께 걸린다.
    yellow_detector: lab_relative
    yellow_lab_margin: 14.0
    yellow_lab_minimum_b: 130.0
    # 중앙선 폭보다 넉넉히 넓게. 이보다 좁은 노란 줄무늬만 남는다.
    yellow_lab_tophat_width_px: 81
    # 노란선 전용 ROI. 세로는 y=240 부터, 가로는 화면 중앙 기준 사다리꼴이다.
    # 아래 42%, 위 14% 반폭. 먼 행일수록 좁게 봐서 벽과 바닥을 애초에 뺀다.
    yellow_roi_top_ratio: 0.50
    yellow_roi_bottom_half_width_ratio: 0.48
    yellow_roi_top_half_width_ratio: 0.30
    yellow_hue_low: 15
    yellow_hue_high: 45
    yellow_saturation_low: 55
    yellow_saturation_high: 255
    yellow_value_low: 110
    yellow_value_high: 255
    yellow_lane_dilate_px: 5
    yellow_open_kernel_px: 3
    yellow_search_half_width_ratio: 0.34
    yellow_maximum_run_width_ratio: 0.22
    yellow_minimum_run_pixels: 3
    yellow_minimum_rows: 8
    # 선택 조건. 노란 배리어를 배제할 수 있지만 한쪽 도로만 보이는 프레임에서
    # 중앙선을 놓친다. 실측에서 검출률이 87% -> 31% 로 떨어져 기본은 끈다.
    # 후보가 도로에 붙어 있을 것을 요구한다. 도로 위에 그려졌거나 두 주행영역 사이
    # 틈에 있어야 한다. 벽의 나무 슬랫을 거르는 조건이다.
    yellow_require_road_anchor: false
    yellow_require_road_on_both_sides: false
    yellow_side_support_ratio: 0.02
    yellow_side_search_ratio: 0.10
    # 점선 구간에서 목표선을 유지하는 최대 프레임 수
    yellow_ghost_maximum_frames: 20
    yellow_history_size: 10
    yellow_minimum_confidence: 0.30

    # --- 차선 점유 판정과 회피 ---
    # 기본값은 꺼짐. 노란선 추종만 먼저 검증한 뒤 launch 인자로 켠다.
    maneuvers_enabled: false
    lane_sample_rows: 14
    lane_roi_top_ratio: 0.66
    lane_roi_bottom_ratio: 0.76
    lane_minimum_width_ratio: 0.05
    lane_narrow_width_ratio: 0.55
    lane_narrow_rows_required: 4
    # 그 차선 자신의 평상시 폭 대비 이 비율 아래로 줄어야 장애물로 인정한다.
    # 벽을 낀 구간처럼 원래 좁은 쪽을 상시 장애물로 오인하지 않기 위한 조건이다.
    lane_width_drop_ratio: 0.60
    lane_baseline_alpha: 0.05
    lane_baseline_warmup_frames: 20
    policy_enter_hold_sec: 0.30
    policy_clear_hold_sec: 0.40
    policy_pass_distance_m: 0.70
    policy_target_rate_px_s: 260.0
    policy_shift_speed_scale: 0.75
    policy_return_tolerance_px: 12.0
    # 회피는 직선에서만. 대회 장애물(정지 차량 1, 이동 차량 1)은 직선 차선에 놓인다.
    policy_straight_only: true
    policy_maximum_heading_deg: 12.0

    # --- 라이다 구역 ---
    # xycar_lidar 원시 0 rad 은 후방을 본다. pi 를 더해 0 = 정면으로 맞춘다.
    # 실측 2026-08-19: 라이다가 차 앞으로 튀어나와 있어 후방 163도를 차체가 가린다.
    # 가림 구간 원시 220.4~22.7도, 후방 중심 301.6도 -> 정면은 원시 121.6도.
    lidar_angle_offset_rad: -2.1217
    # 부채꼴이 아니라 차량 좌표계의 직사각 코리도로 자른다. 차량은 늘 차선 안에
    # 있으므로 옆 차선 차량은 이 상자에 들어오고, 벽과 연석은 상자 밖에 남는다.
    lidar_forward_minimum_m: 0.35
    lidar_forward_maximum_m: 2.50
    lidar_side_lateral_minimum_m: 0.12
    lidar_side_lateral_maximum_m: 0.75
    lidar_front_lateral_maximum_m: 0.20
    lidar_minimum_range_m: 0.15
    lidar_maximum_range_m: 6.0
    lidar_minimum_hits: 5
    lidar_confirm_distance_m: 1.60
    lidar_maximum_age_sec: 0.50

    # --- 조향과 속도 ---
    speed_mps: 0.50
    steering_sign: -1.0
    steering_kp: 0.42
    # 4.0 은 오차 91px 만에 최대 조향에 닿아 오버슈트를 키웠다. 절반으로 낮추고
    # 부족한 반응은 차선 기울기 항이 메운다.
    # 12:23 주행에서 오차 119px 에 legacy 54(최대 70의 77%)까지 갔다. 더 낮춘다.
    # 곡선에서 오차 102px 에 legacy 29 밖에 안 나갔다. 여유 구간이 중앙 근처를
    # 이미 잘라 주므로 게인을 올려도 직선은 흔들리지 않는다.
    steering_output_gain: 3.2
    # 가로오차의 시간 미분. 중앙에 닿기 전에 조향을 풀어 S 자 진동을 없앤다.
    # 화면 속 차선 기울기는 쓰지 않는다. 원근 때문에 나란히 선 차도 기울기가 음수로
    # 나와 가로오차와 반대로 작용하고, 실제로 조향 부호를 뒤집은 적이 있다.
    # 미분이 비례의 절반도 안 돼 복귀 중에도 조향이 안 풀렸다. 크게 올린다.
    # 0.9 는 비례항의 3배로 작용해 복귀 중에 반대로 꺾었다.
    steering_kd: 0.45
    steering_rate_filter_alpha: 0.30
    # 중앙 여유 구간. 차선 반폭 250px 기준 10%. 이 안에서는 조향하지 않는다.
    steering_deadband_px: 25.0
    # 가로오차를 재는 행. 차 바로 앞이라야 실제 이탈량이 된다.
    steering_near_y_ratio: 0.76
    # 경로가 이보다 짧으면 기울기를 믿지 않고 가로오차만 쓴다 (화면 높이 대비)
    steering_minimum_span_ratio: 0.06
    # 저역통과가 느려 조향이 오차보다 늦게 따라왔다. 지연을 줄인다.
    steering_filter_alpha: 0.55
    max_steering_rad: 0.476
    # 곡선에서 풀락까지 0.40초 -> 0.26초
    max_steering_rate_rad_s: 1.8

twinmixing_center_drive_bridge:
  ros__parameters:
    armed: false
    drive_preview_topic: /kobot_lane_drive/twinmixing_center/drive_preview
    status_topic: /kobot_lane_drive/twinmixing_center/status
    enable_topic: /kobot_lane_drive/record_drive/enabled
    command_timeout_sec: 0.30
    max_speed_mps: 0.50
    max_steering_rad: 0.476
    angle_scale: 0.0068
    speed_scale: 0.08
