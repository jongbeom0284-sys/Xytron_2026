twinmixing_center_drive:
  ros__parameters:
    image_topic: /image_raw
    debug_image_topic: /kobot_lane_drive/twinmixing_center/debug_image
    status_topic: /kobot_lane_drive/twinmixing_center/status
    drive_preview_topic: /kobot_lane_drive/twinmixing_center/drive_preview
    max_processing_hz: 15.0
    debug_publish_hz: 7.0
    variant: large
    use_fp16: true
    roi_top_ratio: 0.46
    roi_bottom_ratio: 0.97
    row_step: 4
    search_half_width_ratio: 0.24
    minimum_gap_width_ratio: 0.004
    maximum_gap_width_ratio: 0.18
    minimum_side_support_ratio: 0.02
    minimum_points: 18
    lookahead_y_ratio: 0.67
    minimum_region_width_ratio: 0.12
    region_search_half_width_ratio: 0.40
    minimum_confidence: 0.35
    speed_mps: 0.50
    steering_sign: -1.0
    steering_kp: 0.42
    steering_output_gain: 4.0
    steering_filter_alpha: 0.35
    max_steering_rad: 0.476
    max_steering_rate_rad_s: 1.20

twinmixing_center_drive_bridge:
  ros__parameters:
    armed: false
    drive_preview_topic: /kobot_lane_drive/twinmixing_center/drive_preview
    status_topic: /kobot_lane_drive/twinmixing_center/status
    enable_topic: /kobot_lane_drive/record_drive/enabled
    command_timeout_sec: 0.30
    max_speed_mps: 0.50
    max_steering_rad: 0.476
    angle_scale: 0.0068
    speed_scale: 0.08
