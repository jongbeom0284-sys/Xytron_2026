/**:
  ros__parameters:
    video_device: /dev/videoCAM
    image_width: 640
    image_height: 480
    framerate: 30.0
    pixel_format: yuyv2rgb
    frame_id: default_cam
    camera_name: kobot_camera
    camera_info_url: file:///home/xytron/2026_Xytron/real/calibration/kobot_camera.yaml
    # 실내 조명 반사 대응. 자동 노출은 흰 바닥에 물려 화면이 날아간다.
    brightness: 0
    autoexposure: false
    exposure: 40
    # 자동 화이트밸런스는 실내 누런 조명에 물려 장면 전체에 노란 캐스트를 씌운다.
    # 그러면 흰 차선과 나무색이 노란선 쪽으로 끌려와 색으로 가를 수 없게 된다.
    auto_white_balance: false
    white_balance: 4600
