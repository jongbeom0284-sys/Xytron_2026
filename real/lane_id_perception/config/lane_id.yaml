lane_id_perception:
  ros__parameters:
    image_topic: /image_raw
    debug_topic: /lane_id/debug
    debug_image_topic: /lane_id/debug_image
    front_detection_image_topic: /lane_id/front_detection_image
    bev_image_topic: /lane_id/bev_image
    mask_image_topic: /lane_id/mask_image

    vehicle_width_m: 0.42
    safety_margin_m: 0.08
    min_safe_corridor_m: 0.12
    initial_lane_width_m: 1.35
    lane_width_min_m: 0.80
    lane_width_max_m: 2.20
    lane_width_alpha: 0.04
    memory_timeout_s: 0.8

    roi_y0_ratio: 0.42
    source_top_y_ratio: 0.50
    source_bottom_y_ratio: 0.98
    source_top_half_width_ratio: 0.18
    source_bottom_half_width_ratio: 0.49
    source_center_x_ratio: 0.50
    ground_x_max_m: 8.0
    ground_y_left_m: 2.2
    ground_y_right_m: -2.2
    bev_width_px: 480
    bev_height_px: 640

    yellow_h_min: 15
    yellow_h_max: 42
    yellow_s_min: 70
    yellow_v_min: 80
    white_s_max: 85
    white_v_min: 165
    road_s_max: 70
    road_v_min: 35
    road_v_max: 230

    min_component_area_px: 18
    max_component_area_px: 50000
    min_component_height_px: 4
    min_component_width_px: 2
    horizontal_component_aspect_ratio: 4.0
    horizontal_component_min_area_px: 90
    morphology_kernel_px: 3
    boundary_row_step_px: 3
    fit_min_points: 18
    fit_min_x_m: 0.6
    fit_max_x_m: 7.5
    ransac_iterations: 80
    ransac_residual_m: 0.10
    ransac_min_inlier_ratio: 0.38
    max_fit_rmse_m: 0.16

    previous_fit_max_offset_m: 0.65
    max_center_jump_m: 0.55
    max_center_step_m: 0.28
    low_confidence_max_center_step_m: 0.12
    center_filter_alpha: 0.32
    low_confidence_center_filter_alpha: 0.14
    max_lane_width_jump_m: 0.45
    max_curvature_jump: 0.18
    intersection_horizontal_count: 4
    intersection_component_count: 28
    intersection_hold_s: 0.65

    scanline_step_px: 8
    scanline_min_slices: 5
    scanline_max_missed_slices: 10
    scanline_link_max_gap_m: 0.32
    wide_search_after_s: 0.25
    wide_source_top_y_ratio: 0.30
    wide_source_top_half_width_ratio: 0.32
    wide_confidence_scale: 0.65

    publish_debug_image: true
    show_debug_window: false
